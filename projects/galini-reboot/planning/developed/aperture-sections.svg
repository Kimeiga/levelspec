<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a36a86"/></marker></defs><rect width="1440" height="960" fill="#f8f3e6"/><g font-family="sans-serif" fill="#203e44"><text x="42" y="43" font-size="26" font-weight="700">GALINI · L01 · coordinate aperture sections</text><text x="42" y="72" font-size="15">Positive combat information is deliberately bounded; intermediate body/eye states still require actual captures</text><text x="65" y="110" font-size="22" font-weight="700">W01 · Laundry → Net Street</text><path d="M41,299 H86.83505728296106 M427.013853424491,395 H523.013853424491" stroke="#355d65" stroke-width="4"/><path d="M86.83505728296106,299 V270.2 M86.83505728296106,243.8 V236.60000000000002" stroke="#355d65" stroke-width="10"/><path d="M65,258.824 L475.013853424491,354.824" fill="none" stroke="#a84868" stroke-width="2"/><path d="M65,274.448 L475.013853424491,354.824" fill="none" stroke="#5b83a1" stroke-width="2" stroke-dasharray="5 4"/><circle cx="65" cy="258.824" r="4" fill="#a84868"/><circle cx="475.013853424491" cy="354.824" r="4" fill="#a84868"/><text x="950" y="155" font-size="15" fill="#24494f">Upper floor +4; lower +0. Standing eye ray</text><text x="950" y="178" font-size="15" fill="#24494f">reaches the wall at z 5.461, inside the</text><text x="950" y="201" font-size="15" fill="#24494f">aperture. Crouched upper eye is below the</text><text x="950" y="224" font-size="15" fill="#24494f">sill. The selected standing line is</text><text x="950" y="247" font-size="15" fill="#24494f">reciprocal.</text><text x="950" y="295" font-size="15" fill="#24494f">Aperture width 3.0 m; sill 5.20, head 6.30,</text><text x="950" y="318" font-size="15" fill="#24494f">wall top 6.60 in world Z. It is not a</text><text x="950" y="341" font-size="15" fill="#24494f">movement opening. Exact body exposure,</text><text x="950" y="364" font-size="15" fill="#24494f">oblique views and nearby guards need compiled</text><text x="950" y="387" font-size="15" fill="#24494f">review.</text><text x="65" y="440" font-size="14">Horizontal / vertical scale 24 px per meter. Purple = standing eye ray; blue dashed = upper crouched eye ray. Not raycast or engine evidence.</text><text x="65" y="500" font-size="22" font-weight="700">W02 · Civic span → Middle span</text><path d="M41,689 H84.2 M732.2,785 H828.2" stroke="#355d65" stroke-width="4"/><path d="M84.2,689 V662.6 M84.2,638.6 V631.4" stroke="#355d65" stroke-width="10"/><path d="M65,648.8240000000001 L780.2,744.8240000000001" fill="none" stroke="#a84868" stroke-width="2"/><path d="M65,664.448 L780.2,744.8240000000001" fill="none" stroke="#5b83a1" stroke-width="2" stroke-dasharray="5 4"/><circle cx="65" cy="648.8240000000001" r="4" fill="#a84868"/><circle cx="780.2" cy="744.8240000000001" r="4" fill="#a84868"/><text x="950" y="545" font-size="15" fill="#24494f">Upper floor +8; lower +4. Standing eye ray</text><text x="950" y="568" font-size="15" fill="#24494f">reaches the wall at z 9.567, inside the</text><text x="950" y="591" font-size="15" fill="#24494f">aperture. Crouched upper eye is below the</text><text x="950" y="614" font-size="15" fill="#24494f">sill. The selected standing line is</text><text x="950" y="637" font-size="15" fill="#24494f">reciprocal.</text><text x="950" y="685" font-size="15" fill="#24494f">Aperture width 3.0 m; sill 9.10, head 10.10,</text><text x="950" y="708" font-size="15" fill="#24494f">wall top 10.40 in world Z. It is not a</text><text x="950" y="731" font-size="15" fill="#24494f">movement opening. Exact body exposure,</text><text x="950" y="754" font-size="15" fill="#24494f">oblique views and nearby guards need compiled</text><text x="950" y="777" font-size="15" fill="#24494f">review.</text><text x="65" y="830" font-size="14">Horizontal / vertical scale 24 px per meter. Purple = standing eye ray; blue dashed = upper crouched eye ray. Not raycast or engine evidence.</text></g></svg>