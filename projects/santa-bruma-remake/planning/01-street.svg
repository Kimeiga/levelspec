<text x="838" y="151" fill="#153741" font-size="13" font-weight="760" text-anchor="start">01   CITY THRESHOLD</text>
<text x="838" y="169" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">The booth splits the forecourt</text>
<text x="838" y="184" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">into the main arches and an</text>
<text x="838" y="199" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">offset side arcade to B.</text>
<text x="838" y="233" fill="#153741" font-size="13" font-weight="760" text-anchor="start">02   TWO BRIDGES</text>
<text x="838" y="251" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Public bridge enters the hall</text>
<text x="838" y="266" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">on its south shoulder. Staff</text>
<text x="838" y="281" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">bridge leaves behind CT cover.</text>
<text x="838" y="315" fill="#153741" font-size="13" font-weight="760" text-anchor="start">03   LIMITED OVERLOOK</text>
<text x="838" y="333" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">West window at y45–49.</text>
<text x="838" y="348" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Sill +6.08 m, head +7.08 m.</text>
<text x="838" y="363" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Solid rail stair cheeks below.</text>
<text x="838" y="397" fill="#153741" font-size="13" font-weight="760" text-anchor="start">04   SPATIAL BOUNDARIES</text>
<text x="838" y="415" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Shaded rail and north platform</text>
<text x="838" y="430" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">are scenic. The street and both</text>
<text x="838" y="445" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">platform stairs are walkable.</text>
<text x="838" y="479" fill="#153741" font-size="13" font-weight="760" text-anchor="start">05   B RETAKE</text>
<text x="838" y="497" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Gallery and duty corridor</text>
<text x="838" y="512" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">return through separate doors.</text>
<text x="838" y="622" fill="#153741" font-size="12" font-weight="650" text-anchor="start">N ↑      1 grid cell = 5 m</text>
<text x="838" y="641" fill="#153741" font-size="11" font-weight="500" text-anchor="start">Dashed arrows show movement.</text>
