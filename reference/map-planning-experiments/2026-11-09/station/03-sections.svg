<text x="260" y="1199" font-family="Arial, sans-serif" font-size="15" fill="#20313c">Landing +2.40</text>
<text x="376" y="1147" font-family="Arial, sans-serif" font-size="16" fill="#20313c">Bridge +4.80 → east gallery → concourse</text>
<text x="850" y="1030" font-family="Arial, sans-serif" font-size="21" fill="#20313c" font-weight="bold">HEIGHT INTENT / OPEN QUESTIONS</text>
<text x="850" y="1060" font-family="Arial, sans-serif" font-size="17" fill="#627681">One principal occupied upper datum: +4.80 m.</text>
<text x="850" y="1085" font-family="Arial, sans-serif" font-size="17" fill="#627681">Mail bay and platforms share that level.</text>
<text x="850" y="1110" font-family="Arial, sans-serif" font-size="17" fill="#627681">No roof route or drop is needed for a connection.</text>
<text x="850" y="1135" font-family="Arial, sans-serif" font-size="17" fill="#627681">Stairs need landings, guards and body-clearance checks.</text>
<text x="850" y="1160" font-family="Arial, sans-serif" font-size="17" fill="#627681">Vehicle height, track structure and roof supports</text>
<text x="850" y="1185" font-family="Arial, sans-serif" font-size="17" fill="#627681">are spatial allowances, not engineering verification.</text>
<text x="850" y="1210" font-family="Arial, sans-serif" font-size="17" fill="#627681">The plan and these sections remain hypotheses.</text>
<line x1="60" y1="1330" x2="1620" y2="1330" stroke="#20313c" stroke-width="1" />
<text x="60" y="1362" font-family="Arial, sans-serif" font-size="17" fill="#20313c">PHASE 1 • Revised initial spatial proposal / r03 • All dimensions and anchors provisional</text>
<text x="60" y="1388" font-family="Arial, sans-serif" font-size="15" fill="#627681">Interest review: r02 promising; r03 boundary recheck pending. No AML, collision walkthrough, measurement or playtest.</text>
