</text>
<text x="1260.00" y="331.00" text-anchor="start" font-size="14">
<tspan x="1260.00" dy="0.00">Continuous market paving.</tspan>
<tspan x="1260.00" dy="16.80">The loggia is an open-sided</tspan>
<tspan x="1260.00" dy="16.80">covered margin, not an upper</tspan>
<tspan x="1260.00" dy="16.80">route. Auction office remains</tspan>
<tspan x="1260.00" dy="16.80">a complete enclosed mass.</tspan>
</text>
<text x="64.00" y="592.00" text-anchor="start" font-size="20" font-weight="700">
