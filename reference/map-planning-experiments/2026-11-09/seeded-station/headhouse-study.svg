<text x="880" y="982" font-size="13" style="fill:#34474a">Rail beds terminate beside the apron, never across it.</text>
<text x="850" y="1085" font-size="13" style="fill:#34474a">ENCLOSURE / ORIENTATION</text>
<text x="850" y="1104" font-size="13" style="fill:#34474a">Heavy perimeter = full wall. Solid islands = full-height rooms/kiosk.</text>
<text x="850" y="1123" font-size="13" style="fill:#34474a">Dotted cross-lines = overhead beams / arches, no low partition.</text>
<text x="850" y="1142" font-size="13" style="fill:#34474a">Green plan cone = provisional architectural orientation toward shed.</text>
<text x="850" y="1161" font-size="13" style="fill:#34474a">07 has columns and a roof but open long sides; it faces the court.</text>
<text x="850" y="1180" font-size="13" style="fill:#34474a">This is not a measured combat visibility study.</text>
<text x="60" y="1315" font-size="13" style="fill:#34474a">Same XY as the whole-map plan; enlarged approximately 13 px/m. H–H and P–P are schematic architectural sections with labeled datums.</text>
