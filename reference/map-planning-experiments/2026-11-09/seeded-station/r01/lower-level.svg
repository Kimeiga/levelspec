<text x="1180" y="370" font-size="13" style="fill:#34474a">LOWER JOURNEYS</text>
<text x="1180" y="389" font-size="13" style="fill:#34474a">West public stair W reaches</text>
<text x="1180" y="408" font-size="13" style="fill:#34474a">the quay through the arcade.</text>
<text x="1180" y="427" font-size="13" style="fill:#34474a">Subway N–I connects parcels</text>
<text x="1180" y="446" font-size="13" style="fill:#34474a">to the express island, with</text>
<text x="1180" y="465" font-size="13" style="fill:#34474a">an onward public quay exit.</text>
<text x="1180" y="484" font-size="13" style="fill:#34474a">The eastern promenade turns</text>
<text x="1180" y="503" font-size="13" style="fill:#34474a">into a delivery court, then</text>
<text x="1180" y="522" font-size="13" style="fill:#34474a">the lower freight loading hall.</text>
<text x="1180" y="541" font-size="13" style="fill:#34474a">C and G reconnect this working</text>
<text x="1180" y="560" font-size="13" style="fill:#34474a">floor with the upper station.</text>
<text x="1180" y="640" font-size="13" style="fill:#34474a">ACTUAL INTERFACES</text>
<text x="1180" y="659" font-size="13" style="fill:#34474a">Subway passes beneath track</text>
<text x="1180" y="678" font-size="13" style="fill:#34474a">beds at a proposed 3 m clear</text>
<text x="1180" y="697" font-size="13" style="fill:#34474a">height; section S–S shows it.</text>
<text x="1180" y="716" font-size="13" style="fill:#34474a">The hoist connects goods</text>
<text x="1180" y="735" font-size="13" style="fill:#34474a">handling, never player travel.</text>
<text x="1180" y="754" font-size="13" style="fill:#34474a">Retaining walls enclose fill.</text>
<text x="1180" y="773" font-size="13" style="fill:#34474a">The raised station has roofs;</text>
<text x="1180" y="792" font-size="13" style="fill:#34474a">the quay and courts are open.</text>
<text x="1180" y="811" font-size="13" style="fill:#34474a">Quay edge is a play boundary.</text>
<text x="1180" y="830" font-size="13" style="fill:#34474a">No swim route is proposed.</text>
<text x="1180" y="890" font-size="13" style="fill:#34474a">DRAWING LIMITS</text>
<text x="1180" y="909" font-size="13" style="fill:#34474a">A stair label is a spatial intent.</text>
<text x="1180" y="928" font-size="13" style="fill:#34474a">Risers, landings, headroom,</text>
<text x="1180" y="947" font-size="13" style="fill:#34474a">body clearance and route</text>
<text x="1180" y="966" font-size="13" style="fill:#34474a">timings require later design</text>
<text x="1180" y="985" font-size="13" style="fill:#34474a">and compiled inspection.</text>
