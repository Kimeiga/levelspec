<text x="1000" y="132" class="side" font-weight="bold">LEVELS / CONSTRUCTION</text>
<text x="1000" y="155" class="side" font-weight="normal">Lower deck = 0.00; raised deck = +2.40.</text>
<text x="1000" y="178" class="side" font-weight="normal">Slabs 0.35 thick; solid steel bulkheads 0.30.</text>
<text x="1000" y="201" class="side" font-weight="normal">Internal wall tops: +4.60 above local deck.</text>
<text x="1000" y="224" class="side" font-weight="normal">Sea guards 1.25; pink wind baffles 2.80.</text>
<text x="1000" y="247" class="side" font-weight="normal">SW: y40→48; SA: y44→52; SB: y54→60.</text>
<text x="1000" y="270" class="side" font-weight="normal">All stairs: 16 risers × 0.15; width 6.00.</text>
<text x="1000" y="293" class="side" font-weight="normal">Both ends have ≥2.00 deep landings.</text>
<text x="1000" y="316" class="side" font-weight="normal"></text>
<text x="1000" y="339" class="side" font-weight="bold">BODY / VIEW ASSUMPTIONS</text>
<text x="1000" y="362" class="side" font-weight="normal">Radius 0.30; standing 1.80; crouch 1.10.</text>
<text x="1000" y="385" class="side" font-weight="normal">Eye = 1.674 standing / 1.023 crouching.</text>
<text x="1000" y="408" class="side" font-weight="normal">Step 0.25; slope limit 42°; FOV 75° study.</text>
<text x="1000" y="431" class="side" font-weight="normal">Dashes = predicted view lines, not movement.</text>
<text x="1000" y="454" class="side" font-weight="normal">Low cover 1.20 hides crouched eye nominally.</text>
<text x="1000" y="477" class="side" font-weight="normal">Tall masses 2.6–4.0 above supporting deck.</text>
<text x="1000" y="500" class="side" font-weight="normal"></text>
<text x="1000" y="523" class="side" font-weight="bold">FOCUSED REVIEW SECTIONS</text>
<text x="1000" y="546" class="side" font-weight="normal">1 T/F: five spawns, two exits, freight loop.</text>
<text x="1000" y="569" class="side" font-weight="normal">2 W/V: machinery turns, lateral threshold.</text>
<text x="1000" y="592" class="side" font-weight="normal">3 SW/SA: ascent, follower, head and foot.</text>
<text x="1000" y="615" class="side" font-weight="normal">4 A: two attack entries, CT doorway, holds.</text>
<text x="1000" y="638" class="side" font-weight="normal">5 C/P: outer vs valve route, narrow O06.</text>
<text x="1000" y="661" class="side" font-weight="normal">6 B: tanks, crossfire, plant and rear stair.</text>
<text x="1000" y="684" class="side" font-weight="normal">7 SB/Q: reverse ascent, stair head, exit.</text>
<text x="1000" y="707" class="side" font-weight="normal">8 R: five CT spawns behind CT-screen.</text>
<text x="1000" y="730" class="side" font-weight="normal"></text>
<text x="1000" y="753" class="side" font-weight="bold">UNAVAILABLE IN HARNESS</text>
<text x="1000" y="776" class="side" font-weight="normal">Multiplayer; bullets; utility; sound; round rules.</text>
<text x="1000" y="799" class="side" font-weight="normal">Geometry checks cannot prove game balance.</text>
<text x="1000" y="822" class="side" font-weight="normal">See brief.md / inventory.md / design.md.</text>
<text x="80" y="1020" font-size="16">SECTION / stairs (all rise +2.40)  ·  width 6.00  ·  guards +1.10 following flight  ·  no overhead crossing</text><path d="M100 1110 H200 L440 1050 H540" fill="none" stroke="#e6c089" stroke-width="5"/><path d="M100 1100 H200 L440 1040 H540" fill="none" stroke="#97c7c9" stroke-width="2"/><text x="100" y="1145" class="side">foot landing ≥2 m</text><text x="280" y="1145" class="side">16 × 0.15 m</text><text x="460" y="1080" class="side">head landing ≥2 m</text><text x="740" y="1070" class="side">Ocean / voids stay outside playable circulation.</text><text x="740" y="1100" class="side">Dark: full height occluders. Teal: low cover. White: openings.</text><text x="740" y="1130" class="side">O01–O17 and named objects map to editable AML IDs.</text></svg>