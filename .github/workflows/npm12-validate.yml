name: Validate npm 12 install scripts

on:
  push:
    branches:
      - chore/npm12-install-scripts

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Strict npm 12 install
        run: npx -y npm@12 ci --strict-allow-scripts=true
      - name: Validate
        run: |
          npx -y npm@12 run check
          node --test --test-concurrency=2 'tests/*.test.ts'
          npx -y npm@12 run test:site
          npx -y npm@12 run build:site
      - name: Remove temporary validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/npm12-validate.yml
          git commit -m "ci: record npm 12 validation"
          git push origin HEAD:chore/npm12-install-scripts
