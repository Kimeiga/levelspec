name: Fallow audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          version: 3.23.0
          gate: new-only
          fail-on-issues: false
      - name: Print full new-only report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fallow audit --root . --format json --changed-since "$BASE_SHA" --gate new-only > /tmp/fallow.json || true
          cat /tmp/fallow.json
