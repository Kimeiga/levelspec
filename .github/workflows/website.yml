name: Website checks
on:
  pull_request:
  push:
    branches: [main, feat/interactive-demo-website]
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core, unit and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      # Use the shared bounded native/WASM test command.
      - run: npm test
      - run: npm run build:viewer
      - run: npm run build:site
        env:
          SITE_BASE: /levelspec/
  site:
    name: Native site matrix and baked assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:site
  browser:
    name: Reviewer, accessibility and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:site
        env:
          SITE_BASE: /levelspec/
      - run: npm run build:viewer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview:browser
      - name: Verify the production browser experience
        run: |
          npm run preview:site -- --host 127.0.0.1 --port 48217 --strictPort > /tmp/levelspec-site.log 2>&1 &
          SITE_PID=$!
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 48218 --strictPort > /tmp/levelspec-viewer.log 2>&1 &
          VIEWER_PID=$!
          trap 'kill "$SITE_PID" "$VIEWER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:48217/levelspec/ > /dev/null && curl --fail --silent http://127.0.0.1:48218/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:site:browser
          BASE_URL=http://127.0.0.1:48218/ SITE_URL=http://127.0.0.1:48217/levelspec/ npm run test:dressing:browser
        env:
          SITE_BASE: /levelspec/
  producers:
    name: Native AML generator and tracing tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: python3 -m pip install numpy==2.3.5 Pillow==12.3.0
      - run: npm run test:producers
  verify:
    # Keep the existing required check name; every independent suite must pass.
    needs: [core, site, browser, producers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          SITE_RESULT: ${{ needs.site.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PRODUCERS_RESULT: ${{ needs.producers.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$SITE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$PRODUCERS_RESULT" = success
