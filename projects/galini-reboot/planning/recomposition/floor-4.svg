 stroke-width="1"/><line x1="951.8" y1="390.32" x2="921.4" y2="390.32" stroke="#6b8381" stroke-width="1"/><line x1="951.8" y1="394.87999999999994" x2="921.4" y2="394.87999999999994" stroke="#6b8381" stroke-width="1"/><line x1="951.8" y1="399.44000000000005" x2="921.4" y2="399.44000000000005" stroke="#6b8381" stroke-width="1"/><polyline points="936.5999999999999,358.4 936.5999999999999,404" fill="none" stroke="#a16988" stroke-width="2" marker-end="url(#arrow)"/><polyline points="989.8,753.6 1012.5999999999999,677.6 989.8,601.5999999999999" fill="none" stroke="#f3e3b6" stroke-width="38" stroke-linejoin="round"/><polyline points="989.8,753.6 1012.5999999999999,677.6 989.8,601.5999999999999" fill="none" stroke="#a06b87" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1035.4" y="677.6" text-anchor="middle" font-size="11" fill="#885778" >R6</text><text x="267.79999999999995" y="609.2" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">b · Upper laundry porch</text><text x="427.4" y="502.79999999999995" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">c · Press receiving porch</text><text x="761.8" y="677.6" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">f · Salt loft</text><text x="868.1999999999999" y="540.8" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">h · Fountain bend</text><text x="837.8" y="343.2" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">i · School lower arcade</text><text x="967" y="404" text-anchor="middle" font-size="10" fill="#254b53" font-weight="650" paint-order="stroke" stroke="#fcf5df" stroke-width="3">l · Bell stepside</text><text x="1125" y="129" font-size="18" font-weight="700" fill="#294b53">Ground / upper overlap</text><text x="1125" y="157" font-size="14" fill="#284c54">Laundry is a real house: a lower undercroft,</text><text x="1125" y="179" font-size="14" fill="#284c54">indoor return stair and upper street frontage.</text><text x="1125" y="201" font-size="14" fill="#284c54">School has a usable lower arcade below an</text><text x="1125" y="223" font-size="14" fill="#284c54">occupied upper room.</text><text x="1125" y="300" font-size="18" font-weight="700" fill="#294b53">Journeys generated by fronts</text><text x="1125" y="328" font-size="14" fill="#284c54">The civic ascent stops at a +6 m chapel porch,</text><text x="1125" y="350" font-size="14" fill="#284c54">then wraps the chapel. Press enters a stair</text><text x="1125" y="372" font-size="14" fill="#284c54">house and exits toward A; bridge arrivals reach</text><text x="1125" y="394" font-size="14" fill="#284c54">the other side of that same mass.</text><text x="1125" y="471" font-size="18" font-weight="700" fill="#294b53">Different east commitments</text><text x="1125" y="499" font-size="14" fill="#284c54">Salt loading loft descends inside a retaining /</text><text x="1125" y="521" font-size="14" fill="#284c54">store complex. Customs uses a sloping cart</text><text x="1125" y="543" font-size="14" fill="#284c54">road. The upper reserve enters School rooms or</text><text x="1125" y="565" font-size="14" fill="#284c54">takes the public Bell stair.</text><text x="1125" y="642" font-size="18" font-weight="700" fill="#294b53">Three cross-town choices</text><text x="1125" y="670" font-size="14" fill="#284c54">Middle bridge reaches a market threshold. Upper</text><text x="1125" y="692" font-size="14" fill="#284c54">bridge bends into the Inn. The low shore still</text><text x="1125" y="714" font-size="14" fill="#284c54">goes around the ravine toe, with a pause before</text><text x="1125" y="736" font-size="14" fill="#284c54">B. No new cross-ravine edge.</text><text x="1125" y="813" font-size="18" font-weight="700" fill="#294b53">Status / limits</text><text x="1125" y="841" font-size="14" fill="#284c54">R02 compares a changed composition against the</text><text x="1125" y="863" font-size="14" fill="#284c54">rejected terrace-band L01. Openings, guards and</text><text x="1125" y="885" font-size="14" fill="#284c54">every stairwell still require the revised</text><text x="1125" y="907" font-size="14" fill="#284c54">detailed packet. No AML or physical acceptance.</text><text x="55" y="1041" font-size="16" font-weight="650" fill="#294b53">Preserved: calm Greek coastal city / cliffy terrain / 5v5 defusal / radius .30 m, standing 1.80 m, crouch 1.10 m, step .30 m, slope 42°.</text><text x="55" y="1071" font-size="14" fill="#284c54">Spatial comparison only: paths are actual floor proposals but the drawing is not yet a continuous physical proof. The +6 m Chapel porch is an occupied pause; +2/+6 stair landings elsewhere</text><text x="55" y="1093" font-size="14" fill="#284c54">are local transfers. Roofed underpasses reserve 3.7 m below the upper slab. Scenic roofs remain closed.</text></g></svg>