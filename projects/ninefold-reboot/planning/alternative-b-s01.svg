="35" y="870" transform="translate(0,50)" font-size="15">CT Water Street → Dye Store → B north stair, or A rear → Sign Gallery → East Landing; Roof Court is a longer approach switch.</text><text x="35" y="963" font-size="14">Solid gray = inaccessible residential/service mass; colored fill = occupied floor; dashed outlines = another level only. Pink arrows = explicit stairs.</text><text x="35" y="986" font-size="14">Blue dashed lines = bounded observation hypotheses, not movement. Covered volumes retain real roofs; roof cutaways are an inspection choice.</text><text x="35" y="1009" font-size="14">Floor polygons and stair endpoints are provisional. Detailed walls, door apertures, local cover and physical transfer landings follow independent selection.</text><text x="35" y="1032" font-size="14">Do not infer navigation, utility, sound separation or competitive balance from this drawing. Typical links 4–5 m; no mandatory jump, ladder or drop.</text></g></svg>