<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="970" viewBox="0 0 1680 970"><rect width="1680" height="970" fill="#10212b"/><style>text{font-family:Arial,sans-serif;fill:#e5eee9}.note{font-size:18px;fill:#bccbc9}.sub{font-size:22px;font-weight:700}.tag{font-size:21px;font-weight:700;paint-order:stroke;stroke:#10212b;stroke-width:5px}</style><text x="45" y="52" font-size="32" font-weight="700">AFTERSHOCK / ORIGINALITY PROBE / new spatial organizations</text><text x="45" y="88" class="note">Rejected r01: south T → three parallel fronts → two flank sites → rear CT bar + central overpass.</text><rect x="35" y="125" width="500" height="780" rx="12" fill="#192e38" stroke="#48616a"/><rect x="590" y="125" width="500" height="780" rx="12" fill="#192e38" stroke="#48616a"/><rect x="1145" y="125" width="500" height="780" rx="12" fill="#192e38" stroke="#48616a"/><text x="60" y="166" class="sub">01 / CROSS-LINE KNOT</text><path d="M100 500 L190 420 Q290 320 450 250" fill="none" stroke="#bc7969" stroke-width="58" stroke-linejoin="round" stroke-linecap="round" /><path d="M95 260 Q230 310 310 405 L450 510" fill="none" stroke="#74a8b9" stroke-width="58" stroke-linejoin="round" stroke-linecap="round" /><path d="M190 420 Q100 350 150 310 L190 300" fill="none" stroke="#d8b66f" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" /><path d="M380 450 Q450 375 370 320" fill="none" stroke="#d8b66f" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" /><rect x="250" y="325" width="70" height="70" rx="20" fill="#12212b" stroke="#9a9690" stroke-width="12"/><text x="80" y="552" class="tag" fill="#edf6f0">T / lower</text><text x="380" y="560" class="tag" fill="#edf6f0">CT / upper</text><text x="70" y="225" class="tag" fill="#edf6f0">A / upper</text><text x="385" y="220" class="tag" fill="#edf6f0">B / lower</text><text x="222" y="374" class="tag" fill="#edf6f0">void</text><text x="60" y="625" class="note">Two rail directions, two levels.</text><text x="60" y="658" class="note">Transfers loop around an offset shaft.</text><text x="60" y="710" class="note">+ Strong station logic; four distinct arms.</text><text x="60" y="743" class="note">? Could still reduce to two long corridors.</text><text x="60" y="795" class="note">Crash loops must create real local choices.</text><text x="60" y="828" class="note">No traverse through the central crossing.</text><text x="615" y="166" class="sub">02 / BROKEN SPIRAL</text><path d="M665 470 L725 465 Q680 300 810 280 Q905 270 940 350 L1000 380" fill="none" stroke="#74a8b9" stroke-width="60" stroke-linejoin="round" stroke-linecap="round" /><path d="M665 470 L730 520 Q830 600 935 510 Q1010 445 960 400" fill="none" stroke="#bc7969" stroke-width="60" stroke-linejoin="round" stroke-linecap="round" /><path d="M725 465 Q780 420 770 370" fill="none" stroke="#d8b66f" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" /><path d="M900 490 Q850 420 900 345" fill="none" stroke="#d8b66f" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" /><path d="M960 400 L1025 435" fill="none" stroke="#74a8b9" stroke-width="42" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="825" cy="413" rx="47" ry="66" fill="#10212b" stroke="#73818a" stroke-width="13"/><text x="650" y="427" class="tag" fill="#edf6f0">T / west</text><text x="978" y="485" class="tag" fill="#edf6f0">CT / east</text><text x="755" y="237" class="tag" fill="#edf6f0">A / upper crescent</text><text x="807" y="590" class="tag" fill="#edf6f0">B / lower collision</text><text x="787" y="408" class="tag" fill="#edf6f0">solid</text><text x="787" y="434" class="tag" fill="#edf6f0">drum</text><text x="615" y="655" class="note">Sites wrap above and below a solid drum.</text><text x="615" y="688" class="note">Stair journeys and local loops intertwine.</text><text x="615" y="740" class="note">+ Changes site geography and rotation.</text><text x="615" y="773" class="note">+ Earthquake can sever a former full loop.</text><text x="615" y="825" class="note">? Prevent the drum becoming a universal hold.</text><text x="615" y="858" class="note">No all-seeing balcony or endless ring.</text><text x="1170" y="166" class="sub">03 / SHATTERED FAN</text><path d="M1220 430 L1340 430 L1460 285" fill="none" stroke="#bc7969" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" /><path d="M1340 430 L1515 415" fill="none" stroke="#74a8b9" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" /><path d="M1340 430 L1450 545 L1570 520" fill="none" stroke="#d8b66f" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" /><path d="M1275 375 Q1355 275 1460 285" fill="none" stroke="#bc7969" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" /><path d="M1450 545 Q1550 460 1515 415" fill="none" stroke="#74a8b9" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" /><rect x="1310" y="405" width="65" height="45" transform="rotate(-25 1340 430)" fill="#4a6069"/><text x="1185" y="485" class="tag" fill="#edf6f0">T</text><text x="1480" y="580" class="tag" fill="#edf6f0">CT</text><text x="1420" y="245" class="tag" fill="#edf6f0">A</text><text x="1525" y="385" class="tag" fill="#edf6f0">B</text><text x="1250" y="530" class="tag" fill="#edf6f0">scissor wreck</text><text x="1170" y="655" class="note">Radial tracks feed an obstructed throat.</text><text x="1170" y="688" class="note">Terminal loops give bypasses and returns.</text><text x="1170" y="740" class="note">+ Fan geometry reads as rail infrastructure.</text><text x="1170" y="773" class="note">? Throat can become one mandatory choke.</text><text x="1170" y="825" class="note">Need separate pressure without recreating</text><text x="1170" y="858" class="note">three attacker lanes in a different outline.</text></svg>