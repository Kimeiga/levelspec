<tspan x="833.00" dy="0.00">FILLET WALK</tspan>
<tspan x="833.00" dy="14.40">continues</tspan>
</text>
<text x="1015.00" y="1102.00" text-anchor="start" font-size="14">
<tspan x="1015.00" dy="0.00">Street width is shaped by full building masses.</tspan>
<tspan x="1015.00" dy="16.80">Only the narrow stall margin is covered.</tspan>
<tspan x="1015.00" dy="16.80">Roofline heights are provisional architectural</tspan>
<tspan x="1015.00" dy="16.80">enclosure, not accessible vantage points.</tspan>
</text>
<text x="64.00" y="1340.00" text-anchor="start" font-size="20" font-weight="700">
