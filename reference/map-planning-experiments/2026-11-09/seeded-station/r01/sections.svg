<text x="500" y="790" font-size="14" style="fill:#34474a">BUILDING READING</text>
<text x="500" y="810" font-size="14" style="fill:#34474a">A masonry civic headhouse leads into a high fan-shaped circulation room.</text>
<text x="500" y="830" font-size="14" style="fill:#34474a">The passenger shed is one continuous roofed volume around rails and platforms.</text>
<text x="500" y="850" font-size="14" style="fill:#34474a">The freight building uses the same rail datum but opens to the lower road court.</text>
<text x="500" y="870" font-size="14" style="fill:#34474a">The embankment contains a public subway and retained fill; it is not a hollow maze.</text>
<text x="500" y="890" font-size="14" style="fill:#34474a">No train movement, track walking, hoist riding or playable water is assumed.</text>
<text x="500" y="955" font-size="13" style="fill:#34474a">Next study: independent spatial interest, then mechanics, route/visibility development.</text>
<text x="500" y="974" font-size="13" style="fill:#34474a">These drawings stop before that review and before physical modeling.</text>
</svg>
