<text x="1250.00" y="220.00" text-anchor="start" font-size="16" font-weight="700">
<tspan x="1250.00" dy="0.00">READ THE ROUTES</tspan>
</text>
<text x="1250.00" y="250.00" text-anchor="start" font-size="14">
<tspan x="1250.00" dy="0.00">Dashed lines indicate intended</tspan>
<tspan x="1250.00" dy="16.80">ground-level movement through</tspan>
<tspan x="1250.00" dy="16.80">the drawn open space. They do not</tspan>
<tspan x="1250.00" dy="16.80">define exclusive lanes or a navmesh.</tspan>
</text>
<text x="1250.00" y="357.00" text-anchor="start" font-size="14" font-weight="700">
<tspan x="1250.00" dy="0.00">NAMED CONNECTIONS</tspan>
</text>
<text x="1250.00" y="388.00" text-anchor="start" font-size="14">
<tspan x="1250.00" dy="0.00">Retail: Road court → Back lane →</tspan>
<tspan x="1250.00" dy="16.80">Lantern elbow → Auction court</tspan>
<tspan x="1250.00" dy="16.80"></tspan>
<tspan x="1250.00" dy="16.80">Delivery: Road court → Net court →</tspan>
<tspan x="1250.00" dy="16.80">Dispatch throat → Repair court →</tspan>
<tspan x="1250.00" dy="16.80">Weighbridge yard → Ice apron</tspan>
<tspan x="1250.00" dy="16.80"></tspan>
<tspan x="1250.00" dy="16.80">Cross-district: Fillet walk → Wash</tspan>
<tspan x="1250.00" dy="16.80">court → Scales cut → Weighbridge</tspan>
<tspan x="1250.00" dy="16.80"></tspan>
<tspan x="1250.00" dy="16.80">A through-route: Auction court →</tspan>
<tspan x="1250.00" dy="16.80">Loggia → Customs / Scales cut</tspan>
<tspan x="1250.00" dy="16.80"></tspan>
<tspan x="1250.00" dy="16.80">Defender return: Service yard →</tspan>
<tspan x="1250.00" dy="16.80">Market back lane, or Sea walk</tspan>
</text>
<text x="1250.00" y="767.00" text-anchor="start" font-size="14" font-weight="700">
<tspan x="1250.00" dy="0.00">LEVEL TRANSFERS</tspan>
</text>
<text x="1250.00" y="799.00" text-anchor="start" font-size="14">
<tspan x="1250.00" dy="0.00">All main connections remain z 0.00.</tspan>
<tspan x="1250.00" dy="16.80">Loading ledge rises 0.45 m via two</tspan>
<tspan x="1250.00" dy="16.80">5.4 × 4.0 m end ramps (1:12).</tspan>
<tspan x="1250.00" dy="16.80">No stairs, jump gates, drops,</tspan>
<tspan x="1250.00" dy="16.80">roof access or stacked crossings.</tspan>
</text>
<text x="1250.00" y="925.00" text-anchor="start" font-size="14" font-weight="700">
<tspan x="1250.00" dy="0.00">OPEN QUESTIONS</tspan>
</text>
<text x="1250.00" y="957.00" text-anchor="start" font-size="14">
<tspan x="1250.00" dy="0.00">Route competition and exposure,</tspan>
<tspan x="1250.00" dy="16.80">movement/contact times, plant</tspan>
<tspan x="1250.00" dy="16.80">areas, engine body and utility rules</tspan>
<tspan x="1250.00" dy="16.80">remain for subsequent development.</tspan>
</text>
