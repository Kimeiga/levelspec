<text x="1260.00" y="704.00" text-anchor="start" font-size="14">
<tspan x="1260.00" dy="0.00">Both ledge ends return to grade.</tspan>
<tspan x="1260.00" dy="16.80">The planting anchor is on the</tspan>
<tspan x="1260.00" dy="16.80">open apron; final planting area</tspan>
<tspan x="1260.00" dy="16.80">is still provisional. Sea and roofs</tspan>
<tspan x="1260.00" dy="16.80">are outside intended circulation.</tspan>
</text>
<text x="64.00" y="990.00" text-anchor="start" font-size="20" font-weight="700">
