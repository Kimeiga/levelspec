<text x="1240" y="628" font-size="12" style="fill:#34474a">floor remains z−5</text>
<text x="930" y="795" font-size="13" style="fill:#34474a">Pier rows are projected dashed in Q–Q; they are solid in plan.</text>
<text x="930" y="814" font-size="13" style="fill:#34474a">Upper tracks and a scenic service deck occupy the roof above.</text>
<text x="930" y="833" font-size="13" style="fill:#34474a">The quay widens before the arch face; it is not a thin path</text>
<text x="930" y="852" font-size="13" style="fill:#34474a">ending at a generic doorway. The road opens from the east.</text>
<text x="930" y="871" font-size="13" style="fill:#34474a">The lower freight hall is the northward working destination.</text>
<text x="930" y="990" font-size="13" style="fill:#34474a">RETAINING FACE</text>
<text x="930" y="1009" font-size="13" style="fill:#34474a">The five-metre station-side wall remains continuous along</text>
<text x="930" y="1028" font-size="13" style="fill:#34474a">the quiet waterfront, with structural buttresses where the</text>
<text x="930" y="1047" font-size="13" style="fill:#34474a">line turns. The water edge stays separate on the south.</text>
<text x="930" y="1066" font-size="13" style="fill:#34474a">No new rooms, combat obstacles or intermediate junctions</text>
<text x="930" y="1085" font-size="13" style="fill:#34474a">were added to manufacture activity on this long journey.</text>
<text x="60" y="1220" font-size="13" style="fill:#34474a">Same lower-floor XY as the full plan, 15 px/m in the enlarged panel. Q–Q is a schematic section through one arcade bay; load/headroom require later construction review.</text>
