ext><text x="1450" y="140" font-size="22" font-weight="700">SPATIAL DIFFERENCE</text><text x="1450" y="180" class="note">B nests inside the station.</text><text x="1450" y="208" class="note">A follows the outer upper arc.</text><text x="1450" y="250" class="note">No central crossbridge.</text><text x="1450" y="278" class="note">No defender rear crossbar.</text><text x="1450" y="320" class="note">T arrives under A’s west tail.</text><text x="1450" y="348" class="note">CT starts at the east upper tail.</text><text x="1450" y="390" class="note">Two A ascents are separated</text><text x="1450" y="418" class="note">by the cable chamber.</text><text x="1450" y="460" class="note">B: long red bore or shorter</text><text x="1450" y="488" class="note">inner service seam.</text><text x="1450" y="530" class="note">Core is opaque to +14m.</text><text x="1450" y="558" class="note">No occupied top or balconies.</text><text x="1450" y="600" class="note">East descent is exposed only</text><text x="1450" y="628" class="note">after its screened upper entry.</text><text x="1450" y="690" class="note">Gold = stairs / objective.</text><text x="1450" y="718" class="note">Gray = tall fixed mass.</text><text x="1450" y="746" class="note">Green = low duck refuge.</text><text x="40" y="920" font-size="23" font-weight="700">SECTION: the station wraps around a solid core; it does not pass through it</text><path d="M70 1020 H500 M95 1018 L210 960 H480 M520 960 H820 L920 1020" fill="none" stroke="#b6c7c1" stroke-width="14"/><rect x="330" y="930" width="140" height="90" fill="#34474d"/><text x="55" y="1060" class="note">T / lower arrivals → outer or turning ascent → A +5 → CT upper tail → east descent → B 0</text><text x="1050" y="930" class="note">Sketch hypotheses; physical clearances and tactical timings remain for development.</text><text x="1050" y="960" class="note">The old southern upper ring is destroyed and inaccessible, not a fourth bypass.</text></svg>