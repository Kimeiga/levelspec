name: Fallow audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          version: 3.23.0
          gate: new-only
          fail-on-issues: false
      - name: Generate staged health baseline
        run: |
          mkdir -p /tmp/fallow-baselines
          fallow health --css --save-baseline /tmp/fallow-baselines/reference-authoring-health.json --format json > /tmp/fallow-health.json || true
          echo '---REFERENCE_HEALTH_BASELINE_BEGIN---'
          cat /tmp/fallow-baselines/reference-authoring-health.json
          echo
          echo '---REFERENCE_HEALTH_BASELINE_END---'
