name: Website checks
on:
  pull_request:
  push:
    branches: [main, feat/interactive-demo-website]
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:site
      - run: npm run build:viewer
      - run: npm run build:site
        env:
          SITE_BASE: /levelspec/
      - run: npx playwright install --with-deps chromium
      - name: Browser, accessibility, export and offline checks
        run: |
          npm run preview:site -- --host 127.0.0.1 --port 48217 --strictPort > /tmp/levelspec-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:48217/levelspec/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:site:browser
        env:
          SITE_BASE: /levelspec/
