<text x="875" y="115" class="note" font-weight="bold">SPACE AND CONNECTIONS</text>
<text x="875" y="137" class="note" font-weight="normal">T → arcade or forecourt or wash.</text>
<text x="875" y="159" class="note" font-weight="normal">Arcade shares a wall and P14 with Saddle.</text>
<text x="875" y="181" class="note" font-weight="normal">A is adjacent to both Arcade and Saddle.</text>
<text x="875" y="203" class="note" font-weight="normal">Wash wraps the solid kiln K1 into B.</text>
<text x="875" y="225" class="note" font-weight="normal">Inspection joins Saddle, B and service.</text>
<text x="875" y="247" class="note" font-weight="normal">CT service yard joins both sites and R4.</text>
<text x="875" y="269" class="note" font-weight="normal"></text>
<text x="875" y="291" class="note" font-weight="bold">LOCAL CHOICES</text>
<text x="875" y="313" class="note" font-weight="normal">P14 lets a stalled Arcade pair transfer Mid.</text>
<text x="875" y="335" class="note" font-weight="normal">A-press: main/short protection, north exposure.</text>
<text x="875" y="357" class="note" font-weight="normal">B-filter: splits main from CT arrival.</text>
<text x="875" y="379" class="note" font-weight="normal">R4-return: changes CT-to-Mid reveal order.</text>
<text x="875" y="401" class="note" font-weight="normal">D-store: service rotation around shared mass.</text>
<text x="875" y="423" class="note" font-weight="normal"></text>
<text x="875" y="445" class="note" font-weight="bold">BOUNDS / MATERIALS</text>
<text x="875" y="467" class="note" font-weight="normal">Colored shapes = real floor footprints, Z=0.</text>
<text x="875" y="489" class="note" font-weight="normal">Heavy edges = opaque 6m walls.</text>
<text x="875" y="511" class="note" font-weight="normal">Cyan spans = 3m-head movement portals.</text>
<text x="875" y="533" class="note" font-weight="normal">Green masses = closed buildings, +6m.</text>
<text x="875" y="555" class="note" font-weight="normal">Ochre low cover = +1.15m or +1.25m.</text>
<text x="875" y="577" class="note" font-weight="normal">Brown machines = +3.2m; D-store +4m.</text>
<text x="875" y="599" class="note" font-weight="normal">No rectangular arena or playable outer floor.</text>
<text x="875" y="621" class="note" font-weight="normal">Unfilled interstices are outside circulation.</text>
<text x="875" y="643" class="note" font-weight="normal"></text>
<text x="875" y="665" class="note" font-weight="bold">REVIEW BEFORE PRODUCTION</text>
<text x="875" y="687" class="note" font-weight="normal">Standing eye +1.674 / crouched +1.023m.</text>
<text x="875" y="709" class="note" font-weight="normal">Body 1.8m, radius .3m, crouch 1.1m.</text>
<text x="875" y="731" class="note" font-weight="normal">Nominal walk 3.4m/s (estimates only).</text>
<text x="875" y="753" class="note" font-weight="normal">Test opening 5v5, rush, 4+1 and retakes.</text>
<text x="875" y="775" class="note" font-weight="normal">Also 2v2 / 1v2 post-plant.</text>
<text x="875" y="797" class="note" font-weight="normal">No shooting, bomb logic or utility simulation.</text>
<text x="875" y="819" class="note" font-weight="normal"></text>
<text x="875" y="841" class="note" font-weight="bold">RAW → REFINED</text>
<text x="875" y="863" class="note" font-weight="normal">Seed 110826, three arrangements compared.</text>
<text x="875" y="885" class="note" font-weight="normal">Selected folded middle; packed shared edges.</text>
<text x="875" y="907" class="note" font-weight="normal">Removed long direct spawn connection.</text>
<text x="875" y="929" class="note" font-weight="normal">Added local Arcade–Saddle response.</text>
<text x="875" y="951" class="note" font-weight="normal">No incline requirement; all floors level.</text>
<text x="45" y="955" font-size="20">Encounter studies to verify in compiled geometry</text>
<text x="45" y="987" class="note">P05 Arcade → A main • P07 Saddle → A short • P10 Wash → B • P09 Inspection → B • P13 CT → Inspection</text>
<text x="45" y="1014" class="note">Inspect opposing and following positions, portal side peeks, crouched cover and site ownership reversal.</text>
<text x="45" y="1041" class="note">Layout hypotheses only: actual clearance, visibility and travel await compilation; competitive balance awaits playtests.</text>
