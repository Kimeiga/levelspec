<text x="838" y="151" fill="#153741" font-size="13" font-weight="760" text-anchor="start">01   WEST ARRIVAL</text>
<text x="838" y="169" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">The street ramp opens onto</text>
<text x="838" y="184" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">the end of Platform 1. The</text>
<text x="838" y="199" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">trolley court offers a second</text>
<text x="838" y="214" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">approach to the parcels hall.</text>
<text x="838" y="248" fill="#153741" font-size="13" font-weight="760" text-anchor="start">02   A   MAIL BANK</text>
<text x="838" y="266" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Plant sits between a low</text>
<text x="838" y="281" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">sorting counter and tall cage.</text>
<text x="838" y="296" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">The north portal and west</text>
<text x="838" y="311" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">delivery door expose different</text>
<text x="838" y="326" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">faces of the plant area.</text>
<text x="838" y="360" fill="#153741" font-size="13" font-weight="760" text-anchor="start">03   PUBLIC STAIR</text>
<text x="838" y="378" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Opens east, between the rail</text>
<text x="838" y="393" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">edge and the north portal.</text>
<text x="838" y="408" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">The stair flank is screened.</text>
<text x="838" y="442" fill="#153741" font-size="13" font-weight="760" text-anchor="start">04   CT ARRIVAL</text>
<text x="838" y="460" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Staff stair exits south. CT can</text>
<text x="838" y="475" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">take the east door or loop</text>
<text x="838" y="490" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">through the 4 m band under</text>
<text x="838" y="505" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">the bridge deck at y36–40.</text>
<text x="838" y="539" fill="#153741" font-size="13" font-weight="760" text-anchor="start">05   RAIL EDGE</text>
<text x="838" y="557" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">Platform guards control access</text>
<text x="838" y="572" fill="#40595b" font-size="11" font-weight="450" text-anchor="start">to the recessed rail corridor.</text>
<text x="838" y="622" fill="#153741" font-size="12" font-weight="650" text-anchor="start">N ↑      1 grid cell = 5 m</text>
<text x="838" y="641" fill="#153741" font-size="11" font-weight="500" text-anchor="start">Dashed arrows show movement.</text>
</svg>
