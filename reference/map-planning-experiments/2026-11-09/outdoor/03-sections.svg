<tspan x="171.00" dy="0.00">FISH-SHOP WING</tspan>
<tspan x="171.00" dy="15.60">Solid / inaccessible</tspan>
</text>
<text x="304.00" y="1592.00" text-anchor="middle" font-size="13">
<tspan x="304.00" dy="0.00">20 · CART GATE</tspan>
<tspan x="304.00" dy="15.60">6 m open sky · z 0.00</tspan>
</text>
<text x="617.50" y="1592.00" text-anchor="middle" font-size="13">
<tspan x="617.50" dy="0.00">07 · LOGGIA SOUTH ARM</tspan>
<tspan x="617.50" dy="15.60">Covered ground · z 0.00</tspan>
</text>
<text x="1015.00" y="1440.00" text-anchor="start" font-size="14">
<tspan x="1015.00" dy="0.00">Wash court and Auction court meet through</tspan>
<tspan x="1015.00" dy="16.80">a ground-level opening between the fish-shop</tspan>
<tspan x="1015.00" dy="16.80">working wing and the roofed auction margin.</tspan>
<tspan x="1015.00" dy="16.80">The loggia remains a separate through-route;</tspan>
<tspan x="1015.00" dy="16.80">the building extension defines the threshold.</tspan>
</text>
<text x="64.00" y="1640.00" text-anchor="start" font-size="12" fill="#68767b">
<tspan x="64.00" dy="0.00">Sections are authored intentions. No collision, body-fit or gameplay verification has been performed.</tspan>
</text>
