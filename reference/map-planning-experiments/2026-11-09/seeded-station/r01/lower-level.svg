<text x="350" y="1115" font-size="13" style="fill:#34474a">Provisional dimensions; plan north is up. Rail platform datum z=0.00 m.</text>
<text x="60" y="1175" font-size="13" style="fill:#34474a">The lower loop is an authored reinterpretation of the seed&#x27;s lower perimeter; its contours and vertical function are new design decisions.</text>
<text x="60" y="1194" font-size="13" style="fill:#34474a">Dashed upper outlines are context only. The lower drawing deliberately distinguishes real subway volume from inaccessible under-station fill.</text>
